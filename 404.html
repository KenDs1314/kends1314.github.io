<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin señal | Kends web</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: 'indie';
      src: url('/font/IndieFlower.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --verde: #1efe06;
      --violeta: #8a1cff;
      --rojo: #ff1744;
      --plata: #c9c9d6;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: var(--plata);
      font-family: 'Courier New', monospace;
    }

    #estatica {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      opacity: .35;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, .3) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .85) 100%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
    }

    .canal {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 2;
      color: var(--verde);
      text-shadow: 0 0 6px var(--verde);
    }

    .canal::after {
      content: "";
      display: inline-block;
      width: .6em;
      height: .6em;
      margin-left: .6em;
      border-radius: 50%;
      background: var(--rojo);
      box-shadow: 0 0 8px var(--rojo);
      animation: parpadeo 1.2s steps(1) infinite;
    }

    @keyframes parpadeo { 50% { opacity: 0; } }

    h1 {
      margin: 0;
      color: var(--verde);
      font-family: 'indie', sans-serif;
      font-size: clamp(3rem, 15vw, 7rem);
      line-height: 1;
      text-shadow: 3px 0 var(--rojo), -3px 0 var(--violeta), 0 0 18px var(--verde);
      animation: glitch 4s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: none; }
      91% { transform: translateX(-5px) skewX(6deg); }
      94% { transform: translateX(6px); }
      97% { transform: translateX(-3px) skewX(-4deg); }
    }

    p { margin: 0; font-size: 1.1rem; }

    .codigo {
      color: var(--verde);
      text-shadow: 0 0 8px var(--verde);
    }

    a {
      margin-top: 10px;
      padding: 6px 0;
      color: var(--plata);
      text-decoration: none;
      border-bottom: 1px dashed var(--violeta);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    a:hover,
    a:focus-visible,
    a:active {
      color: var(--verde);
      border-bottom: 1px solid var(--verde);
      text-shadow: 0 0 8px var(--verde);
    }

    @media (prefers-reduced-motion: reduce) {
      h1, .canal::after { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="estatica" aria-hidden="true"></canvas>
  <div class="canal">CH 04</div>

  <main>
    <h1>SIN SEÑAL</h1>
    <p class="codigo">error 404</p>
    <p>esta página no existe o se perdió en el ciberespacio</p>
    <a href="/">[ volver al inicio ]</a>
  </main>

  <script>
    const lienzo = document.getElementById('estatica');
    const ctx = lienzo.getContext('2d');
    lienzo.width = 160;
    lienzo.height = 90;

    function pintar() {
      const img = ctx.createImageData(160, 90);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }

    pintar();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setInterval(pintar, 80);
    }
  </script>
</body>
</html>
